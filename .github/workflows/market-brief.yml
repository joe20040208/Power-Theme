name: Market Brief (AM + PM)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '5 13 * * 1-5'   # 09:05 ET (EDT) — AM brief, after open
    - cron: '30 21 * * 1-5'  # 17:30 ET (EDT) — PM brief, after close

jobs:
  market-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      is_trading_day: ${{ steps.trading_day.outputs.is_trading_day }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-market-brief-v1
          restore-keys: pip-market-brief-

      - name: Install deps
        run: |
          pip install requests yfinance pandas python-dotenv google-genai \
                      tradingview-screener exchange-calendars

      - name: Check trading day
        id: trading_day
        run: |
          python - <<'EOF'
          import exchange_calendars as xcals, os
          from datetime import date
          nyse = xcals.get_calendar("XNYS")
          is_session = nyse.is_session(date.today().isoformat())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_trading_day={'true' if is_session else 'false'}\n")
          EOF

      - name: Run Market Brief
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python market_brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit market brief data to repo
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market_brief.json
          git diff --staged --quiet || git commit -m "data: market_brief $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

  deploy:
    needs: market-brief
    if: needs.market-brief.outputs.is_trading_day == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Build React app
        run: npm ci --legacy-peer-deps && npm run build
        env:
          CI: false

      - name: Block API keys in public bundle
        run: |
          if grep -rEl 'AIza[0-9A-Za-z_-]{35}' build/; then echo '::error::API key found in build output'; exit 1; fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v4
